<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Walimatulurus</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-card{max-width:420px;margin:8vh auto;background:#fff;padding:30px 24px;border-radius:18px;box-shadow:0 8px 30px #2c221e12}
    .login-card input{width:100%;padding:13px;border:1px solid #d1c7bd;border-radius:8px;box-sizing:border-box;margin:7px 0 16px}
    .login-card label{text-align:left}
    #loginStatus{min-height:24px;color:#a33;font-size:.9rem}
    .login-card button{width:100%}
  </style>
</head>
<body>
  <main class="login-card">
    <h2>Admin Login</h2>
    <p>Log masuk untuk mengurus galeri majlis.</p>
    <form id="loginForm">
      <label for="email">Email admin</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" class="btn-gold" type="submit">Log Masuk</button>
    </form>
    <p id="loginStatus" role="status"></p>
    <a href="index.html">Kembali ke halaman utama</a>
  </main>
  <script type="module">
    import { auth } from "./js/firebase.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const status = document.getElementById("loginStatus");
    const button = document.getElementById("loginBtn");

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const token = await user.getIdTokenResult(true);
      if (token.claims.admin === true) location.href = "admin.html";
      else {
        await auth.signOut();
        status.textContent = "Akaun ini bukan akaun admin.";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = "Sedang log masuk...";
      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        const token = await credential.user.getIdTokenResult(true);
        if (token.claims.admin !== true) {
          await auth.signOut();
          throw new Error("Akaun ini belum diberikan akses admin.");
        }
        location.href = "admin.html";
      } catch (error) {
        status.textContent = error.message || "Log masuk gagal.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
