<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Majlis</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .ig-card{ position:relative; }
    .like-btn{
      position:absolute; right:6px; bottom:6px;
      padding:6px 11px; font-size:.85rem; font-weight:600;
      background:rgba(255,255,255,.93); color:var(--maroon);
      box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
    .like-btn:hover{ background:#fff; transform:none; }
    .like-btn.liked{ background:var(--maroon); color:#fff; opacity:1; }
    .rank{
      position:absolute; left:6px; top:6px;
      background:var(--gold-accent); color:#fff;
      font-size:.75rem; font-weight:700;
      padding:4px 10px; border-radius:999px;
      box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
  </style>

<link rel="stylesheet" href="css/theme.css">
<script src="js/menu.js" defer></script>
</head>

<body>
  <div class="container gallery-container">
    <h2>Galeri Majlis</h2>

    <p class="gallery-description">
      Tekan ♡ pada gambar kegemaran anda. Gambar paling banyak like berada di atas.
    </p>

    <a href="upload.html" class="btn-gold">+ Kongsi Gambar Anda</a>

    <div id="igFeed" class="ig-feed">
      <p class="loading-text">Memuatkan gambar...</p>
    </div>
  </div>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
