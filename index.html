<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIN &amp; FAIZI - Walimatulurus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .container{
      padding:40px 28px 44px;
    }
    .hero-logo{
      display:block;
      width:210px;
      max-width:60%;
      height:auto;
      margin:0 auto 18px;
      border-radius:18px;
      box-shadow:0 8px 22px rgba(109,26,43,.18);
    }
    .couple-names{
      font-family:'Great Vibes','Brush Script MT',cursive;
      font-weight:400;
      font-size:clamp(3.6rem, 14vw, 6rem);
      line-height:1.1;
      letter-spacing:0;
      margin:10px 0 14px;
      color:var(--maroon);
    }
    .couple-names .amp{
      color:var(--gold-accent);
      padding:0 .08em;
    }
    .event-label{
      font-size:1.05rem;
      letter-spacing:6px;
      text-transform:uppercase;
      color:var(--text-muted);
      margin:0 0 6px;
    }
    .event-title{
      font-size:1.35rem;
      letter-spacing:5px;
      color:var(--gold-accent);
      margin:0;
    }
    .divider{
      width:80px;
      border:0;
      border-top:1px solid var(--gold-accent);
      margin:26px auto;
    }
    .container p{
      font-size:1.05rem;
    }
  </style>

<link rel="stylesheet" href="css/theme.css">
<script src="js/menu.js" defer></script>
</head>

<body>

  <div class="container">

    <img class="hero-logo" src="images/logokawin.jpg" alt="Logo perkahwinan Ain dan Faizi">

    <h1 class="couple-names">Ain <span class="amp">&amp;</span> Faizi</h1>

    <p class="event-label">Walimatulurus</p>
    <p class="event-title">RAJA SEHARI</p>

    <hr class="divider">

    <p>
      Terima kasih kerana meraikan hari bahagia kami.
      Perkongsian kenangan anda amat bermakna bagi kami!
    </p>

    <div style="margin-top: 36px;">

      <a href="upload.html" class="btn-gold">
        Share Your Photos
      </a>

      <br>

      <a href="gallery.html"
         style="display:inline-block; margin-top: 15px; color: var(--text-muted); text-decoration: none;">
        Lihat Galeri Gambar &rarr;
      </a>

    </div>
  </div>

</body>
</html>
