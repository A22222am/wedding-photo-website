
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walimatulurus - Wedding Photo Sharing</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .admin-menu {
      position: absolute;
      top: 20px;
      right: 25px;
      z-index: 1000;
    }

    .menu-dots {
      background: transparent;
      border: none;
      color: var(--gold-accent);
      font-size: 32px;
      cursor: pointer;
      padding: 5px 12px;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      min-width: 150px;
      background: #1c1c1c;
      border: 1px solid var(--gold-accent);
      border-radius: 8px;
      overflow: hidden;
    }

    .dropdown-menu a {
      display: block;
      padding: 12px 16px;
      color: var(--gold-accent);
      text-decoration: none;
    }

    .dropdown-menu a:hover {
      background: #333;
    }

    .dropdown-menu.show {
      display: block;
    }
  </style>
</head>

<body>

  <!-- Three Dots Admin Menu -->
  <div class="admin-menu">
    <button class="menu-dots" onclick="toggleAdminMenu()">⋮</button>

    <div class="dropdown-menu" id="adminDropdown">
      <a href="admin-login.html">Admin Login</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">

    <h1>Walimatulurus</h1>

    <p style="font-size: 1.2rem; color: var(--gold-accent);">
      RAJA SEHARI
    </p>

    <hr style="width: 50px; border: 1px solid var(--gold-accent); margin: 20px auto;">

    <p>
      Terima kasih kerana meraikan hari bahagia kami.
      Perkongsian kenangan anda amat bermakna bagi kami!
    </p>

    <div style="margin-top: 40px;">

      <a href="upload.html" class="btn-gold">
        Share Your Photos
      </a>

      <br>

      <a href="gallery.html"
         style="display:inline-block; margin-top: 15px; color: var(--text-muted); text-decoration: none;">
        Lihat Galeri Gambar &rarr;
      </a>

    </div>
  </div>

  <script>
    function toggleAdminMenu() {
      document.getElementById("adminDropdown").classList.toggle("show");
    }

    window.addEventListener("click", function(event) {
      if (!event.target.closest(".admin-menu")) {
        document.getElementById("adminDropdown").classList.remove("show");
      }
    });
  </script>

</body>
</html>
