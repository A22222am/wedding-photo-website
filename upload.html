<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Gambar - Wedding Photo Sharing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Upload Gambar</h2>
    <p>Pilih gambar kenangan sepanjang majlis untuk dikongsikan bersama pengantin.</p>

    <form id="uploadForm">
      <div class="form-group">
        <label for="uploaderName">Nama Pengirim</label>
        <input type="text" id="uploaderName" placeholder="Contoh: Hafiz & Keluarga" required>
      </div>

      <div class="form-group">
        <label for="photoInput">Pilih Gambar (Boleh pilih banyak)</label>
        <input type="file" id="photoInput" accept="image/*" multiple required>
      </div>

      <button type="submit" id="submitBtn" class="btn-gold">Hantar Gambar</button>
    </form>

    <div id="statusMessage" style="margin-top: 20px; font-weight: 600;"></div>
  </div>

  <script type="module" src="js/upload.js"></script>
</body>
</html>
