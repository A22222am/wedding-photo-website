<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Walimatulurus</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{background:#f7f4ef}
    .admin-wrap{max-width:1100px;margin:auto;padding:24px 16px}
    .admin-top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}
    .stat,.photo-card{background:#fff;border:1px solid #eee6dc;border-radius:14px;padding:15px}
    .stat strong{display:block;font:700 1.7rem Montserrat;color:#8d6c35}
    .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
    .photo-card img{width:100%;height:220px;object-fit:cover;border-radius:9px;background:#eee}
    .photo-meta{text-align:left;overflow-wrap:anywhere}
    .photo-actions{display:flex;gap:8px;margin-top:12px}
    .photo-actions button{flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer}
    .download-action{background:#eee6d8;color:#392d21}
    .delete-action{background:#a83232;color:white}
    #adminStatus{margin:16px 0;color:#6b5e55}
    @media(max-width:480px){.stats{grid-template-columns:1fr}.photo-card img{height:190px}}
  </style>
<link rel="stylesheet" href="css/theme.css">
<script src="js/menu.js" defer></script>
</head>
<body>
  <main class="admin-wrap">
    <header class="admin-top">
      <div>
        <h2>Admin Dashboard</h2>
        <p>Pengurusan Galeri Walimatulurus</p>
      </div>
      <div>
        <a href="gallery.html">Lihat Galeri</a>
        <button id="logoutBtn" class="btn-gold" type="button">Log Keluar</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat"><strong id="photoTotal">0</strong>Jumlah gambar</div>
      <div class="stat"><strong id="senderTotal">0</strong>Nama pengirim</div>
      <div class="stat"><strong id="likeTotal">0</strong>Jumlah Like</div>
    </section>

    <p id="adminStatus" role="status">Memeriksa akses admin...</p>
    <section id="photoGrid" class="photo-grid" aria-live="polite"></section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
